[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "calcium-imaging"
version = "0.0.0"
authors = [
  { name="Javiera Jilberto", email="jilberto@umich.edu" },
]
description = "Python scripts to analyze calcium images"
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy",
  "matplotlib",
  "scipy",
  "scikit-image",
  "tqdm",
  "pandas",
  "itk-elastix",
  "h5py",
  "opencv-python",
  "tifffile",
  "bioio",
  "bioio-nd2",
  "bioio-czi",
  "PySide6",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools]
py-modules = ["imregistration", "imutils", "imio", "calcium_analysis", "plotutils", "gui_utils", "calcium_pipeline"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["calcium_gui*"]

[project.scripts]
calcium-imaging-gui = "calcium_gui.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # itk / SWIG: Python 3.13+ DeprecationWarning about builtin wrapper types (upstream).
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]
